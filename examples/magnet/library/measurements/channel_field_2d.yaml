description: "Channel profile and shape, iron saturation, field angle at the inner wall, coil power"
probes:
  profile: {probe: magnet:probes/channel_profile}
  iron:    {probe: std:probes/part_fields, with: {select: magnetic}}
  wall:    {probe: magnet:probes/channel_wall, with: {wall: inner_wall}}
metrics:
  shape:      {metric: magnet:metrics/field_shape, inputs: {profile: profile}}
  sat:        {metric: std:metrics/saturation,  inputs: {parts: iron}}
  wall_angle: {metric: magnet:metrics/wall_angle,  inputs: {surface: wall}}
  power:      {metric: magnet:metrics/coil_power}
