design: funcs:assemblies/xy
pipeline: funcs:pipelines/branin
measure: funcs:measurements/scalars
variables:
  x1: {param: params.x1, values: [-5, 0, 5, 10]}
  x2: {param: params.x2, range: [0, 15], scale: linear}
objectives: {f: {minimize: f.f}}
sampler:
  kind: product
  of:
    - {kind: grid, vars: [x1]}
    - {kind: sobol, vars: [x2], n: 8, seed: 1}
