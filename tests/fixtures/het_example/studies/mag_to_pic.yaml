description: "Two-stage chain: normalized magnetostatics feeding a (stand-in) WarpX run"
design: het:assemblies/bn_screened
pipeline: het:pipelines/mag_to_pic
measure: het:measurements/mag_pic
variables:
  is_gap: {param: params.inner_screen_gap, values: [12, 20]}
normalize:
  scale: [op.circuits.inner.current, op.circuits.outer.current]
  so_that: {value: shape.peak_Br, equals: 165}
objectives: {e: {minimize: pic.energy.total}}
sampler: {kind: grid}
