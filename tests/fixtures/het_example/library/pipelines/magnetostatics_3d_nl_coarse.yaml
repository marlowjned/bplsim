description: "Nonlinear 3-D magnetostatics (GetDP), coarse mesh for tests"
stages:
  mag:
    backend: getdp_3d ^1.0
    fidelity:
      nonlinear: true
      ramp: "0.5, 0.7, 0.85, 0.95, 1.0"
      mesh: {h_fine: 2.5, h_iron: 6.0, h_far: 80}
      air_radius: 250
    resources: {cores: 1, memory: 4 GB, runtime_hint: 600 s}
